<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Decorative blobs -->
  <ellipse cx="1050" cy="120" rx="320" ry="320" fill="url(#blob1)"/>
  <ellipse cx="100" cy="520" rx="380" ry="380" fill="url(#blob2)"/>

  <!-- Left accent bar -->
  <rect x="80" y="140" width="5" height="340" rx="3" fill="#4f46e5"/>

  <!-- Badge pill -->
  <rect x="108" y="140" width="560" height="40" rx="20" fill="#eef2ff"/>
  <text x="128" y="166" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#4338ca" letter-spacing="0.3">Technical Product Leader | Platforms, Mobile, Data &amp; Digital Health</text>

  <!-- Name -->
  <text x="108" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#0f172a">Monica</text>
  <text x="108" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#4f46e5">Allison.</text>

  <!-- Tagline -->
  <text x="108" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#475569" font-weight="400">Turning complex healthcare and research problems into</text>
  <text x="108" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#475569" font-weight="400">scalable products and systems.</text>

  <!-- URL -->
  <text x="108" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" font-weight="500" letter-spacing="0.5">monicaallison.com</text>
</svg>
